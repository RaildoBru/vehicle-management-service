apiVersion: apps/v1
kind: Deployment

metadata:
  name: vehicle-management

spec:
  replicas: 2

  selector:
    matchLabels:
      app: vehicle-management

  template:
    metadata:
      labels:
        app: vehicle-management

    spec:
      containers:
        - name: vehicle-management
          image: vehicle-management-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3000