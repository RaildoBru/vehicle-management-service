apiVersion: apps/v1
kind: Deployment

metadata:
  name: vehicle-management-service

spec:
  replicas: 2

  selector:
    matchLabels:
    app: vehicle-management-service

  template:
    metadata:
      labels:
        app: vehicle-management-service

    spec:
      containers:
        - name: app
          image: vehicle-sales-service:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 3000